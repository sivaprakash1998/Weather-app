<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SkyPulse">
	<title>SkyPulse</title>
	<defs>
		<linearGradient id="sky" x1="4" y1="2" x2="60" y2="62" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#4f46e5" />
			<stop offset="0.55" stop-color="#0ea5e9" />
			<stop offset="1" stop-color="#22d3ee" />
		</linearGradient>
		<linearGradient id="sun" x1="31" y1="13" x2="51" y2="33" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#fde047" />
			<stop offset="1" stop-color="#f59e0b" />
		</linearGradient>
		<clipPath id="squircle">
			<rect width="64" height="64" rx="14" />
		</clipPath>
	</defs>
	<g clip-path="url(#squircle)">
		<rect width="64" height="64" fill="url(#sky)" />
		<circle cx="41" cy="23" r="11" fill="url(#sun)" />
		<g fill="#ffffff">
			<circle cx="23" cy="39" r="9" />
			<circle cx="34" cy="35" r="12" />
			<circle cx="44" cy="41" r="8" />
			<rect x="14" y="40" width="38" height="9" rx="4.5" />
		</g>
	</g>
</svg>
